name: sync-downloads

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-downloads
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync download counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/sync_download_counts.py
      - name: Commit changes
        run: |
          if git diff --quiet -- teams.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teams.json
          git commit -m "同步下载量"
          git push
